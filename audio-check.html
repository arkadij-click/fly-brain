<!doctype html><meta charset="utf-8"><title>Kitchen audio verification</title><style>body{font:16px system-ui;background:#102018;color:#dff0dc;padding:30px}pre{white-space:pre-wrap}</style><h1>Kitchen audio verification</h1><pre id="result">Rendering offline audio…</pre><script src="audio.js?v=realistic-clap-22"></script><script>
async function render(kind){const context=new OfflineAudioContext(2,44100*8,44100),audio=new FlySound.KitchenAudio();audio.context=context;audio.build();clearInterval(audio.timer);audio.enabled=kind!=='muted';audio.music=kind==='music';audio.effects=kind==='effects';audio.mix();if(kind==='music'||kind==='muted')for(let step=0;step<20;step++)FlySound.score(step).forEach(n=>audio.tone(n,.12+step*60/78/2));if(kind==='effects'){audio.buzzLevel.gain.setValueAtTime(.025,.1);audio.buzzLevel.gain.setValueAtTime(0,1.5);for(const kind of ['takeoff','land','scare','clap','feed','groom','food'])audio.event(kind,-.4);}const result=await context.startRendering();let peak=0,total=0;for(let ch=0;ch<2;ch++){const a=result.getChannelData(ch);for(const value of a){if(!Number.isFinite(value))throw Error('Non-finite sample');peak=Math.max(peak,Math.abs(value));total+=value*value;}}return {peak,rms:Math.sqrt(total/(result.length*2))};}
(async()=>{try{const music=await render('music'),effects=await render('effects'),muted=await render('muted');if(music.rms<.005||effects.rms<.001)throw Error('Expected audible waveform');if(music.peak>.98||effects.peak>.98)throw Error('Clipped audio');if(muted.peak>1e-8)throw Error('Mute did not silence audio');document.getElementById('result').textContent='PASS — Music and effects produce finite, non-clipping waveforms; master mute produces silence.\n'+JSON.stringify({music,effects,muted},null,2);}catch(e){document.getElementById('result').textContent='FAIL — '+e.message;}})();
</script>
